name: Self-host Supabase library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-supabase:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip vendor]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned Supabase browser library
        run: |
          curl --fail --location --retry 3 \
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js' \
            --output supabase.js
          test -s supabase.js

      - name: Replace CDN script with local script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          new = '<script src="./supabase.js"></script>'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          elif new not in s:
              raise SystemExit('Could not find the Supabase script tag to replace.')
          PY

      - name: Commit vendored library if needed
        run: |
          if git diff --quiet -- index.html supabase.js && git ls-files --error-unmatch supabase.js >/dev/null 2>&1; then
            echo 'Already self-hosted; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase.js
          git commit -m 'Self-host Supabase JS [skip vendor]'
          git push
