name: Easy Product Builder Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip easy-builder]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Product Builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="easyProductHelper"' in s:
              print('Easy Product Builder already installed.')
              raise SystemExit(0)

          marker='<h3>Product Builder</h3>'
          helper='''<h3>Product Builder</h3>\n        <div id="easyProductHelper" class="easy-product-helper">\n          <div class="easy-product-head">\n            <div><b>✨ Beginner Easy-Fill</b><span>Choose a few simple answers. The hub fills most of the confusing boxes for you.</span></div>\n            <button type="button" class="btn primary" id="easyFillProductBtn">Fill 90% For Me</button>\n          </div>\n          <div class="form-grid thirds" style="margin-top:14px">\n            <div class="field"><label>Who is this mainly for?</label><select id="easyAudience"><option>Beginners</option><option>Women 40+</option><option>Digital creators</option><option>Small business owners</option><option>Entrepreneurs</option><option>Coaches / educators</option><option>Content creators</option><option>Everyone</option></select></div>\n            <div class="field"><label>What should it help them do?</label><select id="easyGoal"><option>Create faster</option><option>Learn something step by step</option><option>Save time</option><option>Make better visuals</option><option>Launch a product</option><option>Market a business</option><option>Sell digital products</option><option>Get organized</option><option>Generate ideas</option><option>Automate repetitive work</option></select></div>\n            <div class="field"><label>What best describes the value?</label><select id="easyValue"><option>Simple and beginner-friendly</option><option>Fast and time-saving</option><option>Done-for-you guidance</option><option>Professional and polished</option><option>Creative and customizable</option><option>Practical and easy to follow</option><option>All-in-one resource</option></select></div>\n          </div>\n          <div class="easy-note">You still choose the product name, price, links, and anything you want to customize. Everything else can be generated as a strong starting point.</div>\n        </div>'''
          s=s.replace(marker,helper,1)

          css='''\n.easy-product-helper{margin:16px 0 8px;padding:18px;border-radius:20px;border:1px solid rgba(22,143,234,.22);background:linear-gradient(135deg,rgba(22,143,234,.10),rgba(255,255,255,.98));box-shadow:var(--shadow2)}\n.easy-product-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.easy-product-head b{display:block;color:var(--deep);font-size:16px}.easy-product-head span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.easy-note{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.8);color:#617689;font-size:11px;font-weight:700}\n'''
          s=s.replace('</style>',css+'</style>',1)

          js=r'''\n<script>\n(function(){\n  const byId=(id)=>document.getElementById(id);\n  const setIfBlank=(id,val)=>{const el=byId(id);if(el && !String(el.value||'').trim()) el.value=val;};\n  const setVal=(id,val)=>{const el=byId(id);if(el) el.value=val;};\n  const categoryDefaults={\n    'Prompt Pack':{format:'PDF prompt pack / digital prompt collection',delivery:'Instant digital download',includes:'Ready-to-use prompts, quick-start instructions, customization guidance, and examples',rights:'Commercial creation use',cta:'Get the prompt pack',noun:'prompt pack'},\n    'Digital Guide / Ebook':{format:'PDF guide / ebook',delivery:'Instant PDF download',includes:'Step-by-step guide, examples, action steps, and quick-reference tips',rights:'Personal use',cta:'Get the guide',noun:'digital guide'},\n    'Workshop / Class':{format:'Live or recorded workshop',delivery:'Online class access',includes:'Guided training, demonstrations, examples, and practical action steps',rights:'Personal learning use',cta:'Reserve your spot',noun:'workshop'},\n    'Generator / Tool':{format:'Interactive generator / web app',delivery:'Online tool access',includes:'Interactive generator, guided options, reusable outputs, and beginner instructions',rights:'Commercial creation use',cta:'Try the generator',noun:'generator'},\n    'Template Pack':{format:'Editable digital template pack',delivery:'Instant digital download',includes:'Editable templates, usage instructions, and customization guidance',rights:'Commercial creation use',cta:'Get the templates',noun:'template pack'},\n    'Printable':{format:'Printable PDF',delivery:'Instant PDF download',includes:'Print-ready pages, instructions, and reusable worksheets',rights:'Personal use',cta:'Get the printable',noun:'printable'},\n    'Membership / Community':{format:'Online membership / community',delivery:'Private community access',includes:'Community access, ongoing resources, support, updates, and member content',rights:'Member use',cta:'Join now',noun:'membership'},\n    'Bundle':{format:'Digital resource bundle',delivery:'Instant digital download / access',includes:'Multiple coordinated resources, guides, templates, prompts, or tools in one bundle',rights:'Commercial creation use',cta:'Get the bundle',noun:'bundle'},\n    'Other Digital Product':{format:'Digital product',delivery:'Instant digital delivery',includes:'Core digital resource, instructions, and supporting materials',rights:'Personal or commercial use as stated',cta:'Get instant access',noun:'digital product'}\n  };\n  function cleanName(){return (byId('productName')?.value||'this product').trim()||'this product';}\n  function buildEasyFill(){\n    const cat=byId('productCategory')?.value||'Other Digital Product';\n    const d=categoryDefaults[cat]||categoryDefaults['Other Digital Product'];\n    const audience=byId('easyAudience')?.value||'Beginners';\n    const goal=byId('easyGoal')?.value||'Save time';\n    const value=byId('easyValue')?.value||'Simple and beginner-friendly';\n    const name=cleanName();\n    const brandAudience=(window.data&&window.data.brand&&window.data.brand.audience)||'';\n    const audienceText=audience==='Beginners' && brandAudience ? brandAudience : audience;\n    const lowerGoal=goal.charAt(0).toLowerCase()+goal.slice(1);\n    setIfBlank('productFormat',d.format);\n    setIfBlank('productSummary',`${name} is a ${value.toLowerCase()} ${d.noun} designed to help ${audienceText} ${lowerGoal} without unnecessary overwhelm or guesswork.`);\n    setIfBlank('productProblem',`People often know what they want to accomplish, but they get stuck figuring out what to do, what to include, or how to make the process feel simple and manageable.`);\n    setIfBlank('productTransformation',`Go from unsure and overwhelmed to having a clear, practical way to ${lowerGoal}.`);\n    setIfBlank('productPrimaryBenefit',goal);\n    setIfBlank('productSecondaryBenefits',`${value}, saves time, reduces guesswork, gives clear direction`);\n    setIfBlank('productIncludes',d.includes);\n    setIfBlank('productBonuses','Quick-start guide, examples, and practical tips for getting better results');\n    setIfBlank('productRights',d.rights);\n    setIfBlank('productDelivery',d.delivery);\n    setIfBlank('productAudience',audienceText);\n    setIfBlank('productSkill','Beginner-friendly / no advanced experience required');\n    setIfBlank('productPainPoints','Feeling overwhelmed; not knowing where to start; wasting time trying to figure everything out; wanting a simpler process; needing clearer direction');\n    setIfBlank('productDesiredResult',`${goal} with more confidence, less guesswork, and a repeatable process.`);\n    setIfBlank('productBuyReasons',`It makes the process easier; it saves time; it gives them a starting point; it is practical and beginner-friendly; they can use it again and again.`);\n    setIfBlank('productHesitations','They may wonder if it is too advanced, if they need special tools, if they will know how to use it, or if it will actually save them time.');\n    setIfBlank('productCTA',d.cta);\n    setIfBlank('productPrimaryAngle',`${goal} without the overwhelm`);\n    setIfBlank('productSecondaryAngles',`${value}; save time and skip the guesswork; beginner-friendly guidance; practical repeatable results`);\n    setIfBlank('productKeywords',`${cat.toLowerCase()}, ${goal.toLowerCase()}, beginner friendly, digital product, easy to use, time saving`);\n    setIfBlank('productSEO',`${name}, ${cat}, ${goal}, beginner-friendly digital resource, ${audience}`);\n    if(typeof toast==='function') toast('Easy-Fill completed. Review it, change anything you want, then save your product.');\n  }\n  function addLists(){\n    const lists={\n      productFormat:['PDF','Prompt pack','Interactive generator / web app','Live workshop','Recorded class','Template pack','Printable PDF','Digital bundle','Membership / community'],\n      productSkill:['Beginner','Beginner-friendly / no experience required','Intermediate','Advanced','All skill levels'],\n      productRights:['Personal use','Commercial creation use','Commercial use included','Personal + commercial use','Member use'],\n      productDelivery:['Instant PDF download','Instant digital download','Online tool access','Email delivery','Live Zoom class','Recorded class access','Private community access'],\n      productCTA:['Grab it now','Get instant access','See what’s inside','Get the guide','Get the prompts','Try the generator','Reserve your spot','Join now','Get the bundle']\n    };\n    Object.entries(lists).forEach(([id,opts])=>{\n      const el=byId(id); if(!el || el.dataset.easyList) return;\n      el.dataset.easyList='1'; const listId=id+'Options'; el.setAttribute('list',listId);\n      const dl=document.createElement('datalist');dl.id=listId;dl.innerHTML=opts.map(x=>`<option value="${x}"></option>`).join('');document.body.appendChild(dl);\n    });\n  }\n  window.addEventListener('DOMContentLoaded',()=>{\n    addLists();\n    byId('easyFillProductBtn')?.addEventListener('click',buildEasyFill);\n    byId('productCategory')?.addEventListener('change',()=>{\n      const d=categoryDefaults[byId('productCategory').value];\n      if(d){setIfBlank('productFormat',d.format);setIfBlank('productDelivery',d.delivery);setIfBlank('productRights',d.rights);setIfBlank('productCTA',d.cta);}\n    });\n  });\n})();\n</script>\n'''
          s=s.replace('\n</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make Product Builder beginner-friendly [skip easy-builder]"
            git push
          fi
