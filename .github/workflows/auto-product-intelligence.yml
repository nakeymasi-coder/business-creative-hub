name: Automatic Product Intelligence Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip product-brain]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Product Brain upgrade
        run: python scripts/upgrade_product_brain.py
      - name: Commit Product Brain upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make Product Builder strategy automatic [skip product-brain] [skip easy-builder]"
            git push
          fi
