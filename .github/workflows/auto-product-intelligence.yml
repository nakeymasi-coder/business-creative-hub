name: Automatic Product Intelligence Upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip product-brain]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace strategy form with automatic Product Brain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_helper=re.compile(r'<div id="easyProductHelper" class="easy-product-helper">.*?</div>\s*<p>This form captures', re.S)
          new_helper='''<div id="easyProductHelper" class="easy-product-helper">\n          <div class="easy-product-head">\n            <div><b>✨ Product Brain — tell it the basics, not the strategy</b><span>Describe the product like you would explain it to a friend. The hub figures out the audience, problem, benefits, transformation, sales angles, keywords, SEO, CTA, pricing position, and the rest.</span></div>\n            <button type="button" class="btn primary" id="easyFillProductBtn">Build My Product For Me</button>\n          </div>\n          <div class="form-grid" style="margin-top:14px">\n            <div class="field full"><label>What is this product? Just say it normally.</label><textarea id="productPlainDescription" placeholder="Example: It is a prompt generator that turns one affirmation word into image, video, music and marketing prompts."></textarea></div>\n            <div class="field full"><label>What is included? Add only what you already know. Optional.</label><textarea id="productPlainIncludes" placeholder="Example: bonus prompts, how-to-use guide, how-to-sell guide. Leave blank if you are not sure yet."></textarea></div>\n          </div>\n          <div id="productBrainResult" class="easy-note">You do not need to know marketing terms. Add the product name, category and price if you know them, describe the product above, then click <b>Build My Product For Me</b>.</div>\n        </div>\n        <p>This form captures'''
          s,n=old_helper.subn(new_helper,s,count=1)
          print('helper replacements',n)

          # Collapse the strategy-heavy fields so beginners do not have to stare at them.
          start='''        <div class="section-title"><h3>The Offer</h3><span>What it is and why people care</span></div>'''
          end='''        <div class="actions" style="margin-top:16px">\n          <button class="btn primary" id="saveProductBtn">Save Product</button>'''
          if start in s and 'id="productIntelligenceDetails"' not in s:
              s=s.replace(start,'''        <details id="productIntelligenceDetails" class="product-intelligence-details">\n          <summary>Hub-Generated Product Intelligence <span>Review or edit only if you want to</span></summary>\n          <div class="product-intelligence-inner">\n'''+start,1)
              s=s.replace(end,'''          </div>\n        </details>\n\n'''+end,1)

          css='''\n.product-intelligence-details{margin-top:18px;border:1px solid rgba(22,143,234,.18);border-radius:18px;background:rgba(255,255,255,.74);overflow:hidden}.product-intelligence-details summary{cursor:pointer;padding:15px 16px;color:var(--deep);font-weight:900;list-style:none}.product-intelligence-details summary::-webkit-details-marker{display:none}.product-intelligence-details summary span{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:700}.product-intelligence-inner{padding:0 16px 16px}.product-brain-done{background:linear-gradient(135deg,rgba(47,181,119,.10),rgba(255,255,255,.96));border-color:rgba(47,181,119,.28)!important}\n'''
          if '.product-intelligence-details{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          # Replace the previous beginner helper script with a truly automatic Product Brain.
          script_pat=re.compile(r'<script>\s*\(function\(\)\{\s*const byId=\(id\)=>document\.getElementById\(id\);.*?</script>',re.S)
          js=r'''<script>
(function(){
  const byId=(id)=>document.getElementById(id);
  const value=(id)=>(byId(id)?.value||'').trim();
  const set=(id,val,force=true)=>{const el=byId(id);if(el && (force || !String(el.value||'').trim())) el.value=val;};
  const lc=(v)=>String(v||'').toLowerCase();
  const title=(v)=>String(v||'').replace(/\b\w/g,m=>m.toUpperCase());

  const defaults={
    'Prompt Pack':{noun:'prompt pack',format:'PDF prompt pack / digital prompt collection',delivery:'Instant digital download',rights:'Commercial creation use',price:'$17',regular:'$27',sale:'$12',cta:'Get the prompts',includes:'Ready-to-use prompts, quick-start instructions, customization guidance, and examples'},
    'Digital Guide / Ebook':{noun:'digital guide',format:'PDF guide / ebook',delivery:'Instant PDF download',rights:'Personal use',price:'$27',regular:'$37',sale:'$17',cta:'Get the guide',includes:'Step-by-step guidance, examples, action steps, and quick-reference tips'},
    'Workshop / Class':{noun:'workshop',format:'Live or recorded online workshop',delivery:'Online class access',rights:'Personal learning use',price:'$97',regular:'$147',sale:'$77',cta:'Reserve your spot',includes:'Guided training, demonstrations, practical examples, action steps, and supporting resources'},
    'Generator / Tool':{noun:'generator',format:'Interactive generator / web app',delivery:'Online tool access',rights:'Commercial creation use',price:'$27',regular:'$47',sale:'$17',cta:'Get access',includes:'Interactive generator, guided options, reusable outputs, and beginner-friendly instructions'},
    'Template Pack':{noun:'template pack',format:'Editable digital template pack',delivery:'Instant digital download',rights:'Commercial creation use',price:'$27',regular:'$47',sale:'$17',cta:'Get the templates',includes:'Editable templates, usage instructions, and customization guidance'},
    'Printable':{noun:'printable',format:'Printable PDF',delivery:'Instant PDF download',rights:'Personal use',price:'$9',regular:'$17',sale:'$7',cta:'Get the printable',includes:'Print-ready pages, instructions, and reusable worksheets'},
    'Membership / Community':{noun:'membership',format:'Online membership / community',delivery:'Private community access',rights:'Member use',price:'$47/month',regular:'$67/month',sale:'$37/month',cta:'Join now',includes:'Community access, ongoing resources, support, updates, and member content'},
    'Bundle':{noun:'digital bundle',format:'Digital resource bundle',delivery:'Instant digital download / access',rights:'Commercial creation use',price:'$47',regular:'$67',sale:'$37',cta:'Get the bundle',includes:'Multiple coordinated resources, guides, templates, prompts, or tools in one bundle'},
    'Other Digital Product':{noun:'digital product',format:'Digital product',delivery:'Instant digital delivery',rights:'Personal or commercial use as stated',price:'$27',regular:'$37',sale:'$17',cta:'Get instant access',includes:'Core digital resource, instructions, and supporting materials'}
  };

  function inferGoal(text,cat){
    const t=lc(text);
    if(/image|graphic|visual|photo|art|design|thumbnail/.test(t)) return 'create polished visual content faster';
    if(/video|reel|tiktok|youtube|short.form/.test(t)) return 'create video content faster and with clearer direction';
    if(/market|promotion|social|content|caption|launch|sell|sales/.test(t)) return 'market and sell their offers with less guesswork';
    if(/website|site|landing|page/.test(t)) return 'build and improve their online presence more easily';
    if(/prompt|generator|ai/.test(t)) return 'turn ideas into usable AI-ready outputs faster';
    if(/organize|planner|checklist|workflow|system/.test(t)) return 'get organized with a repeatable system';
    if(/learn|teach|class|workshop|guide|tutorial/.test(t)) return 'learn the process step by step and put it into action';
    if(cat==='Membership / Community') return 'get ongoing support, resources, and momentum';
    return 'get a useful result faster with a clearer, simpler process';
  }

  function inferAudience(text,cat){
    const t=lc(text);
    if(/teacher|educator/.test(t)) return 'teachers and educators who want a simpler way to create and use digital resources';
    if(/coach|coaching/.test(t)) return 'coaches and service providers who want practical, ready-to-use business resources';
    if(/creator|content|social/.test(t)) return 'digital creators and small business owners who want to create and market content faster';
    if(/beginner|easy|simple|step.by.step/.test(t)) return 'beginners who want clear guidance without technical overwhelm';
    if(cat==='Workshop / Class') return 'beginners and growing business owners who want guided, hands-on help';
    const brand=(window.data&&window.data.brand&&window.data.brand.audience)||'';
    return brand || 'beginners, creators, and small business owners who want practical help without unnecessary overwhelm';
  }

  function inferIncluded(desc,cat){
    const manual=value('productPlainIncludes');
    if(manual) return manual;
    const d=defaults[cat]||defaults['Other Digital Product'];
    const t=lc(desc);
    let items=[d.includes];
    if(/bonus/.test(t)) items.push('bonus resources');
    if(/guide|how to|instructions/.test(t)) items.push('how-to guidance');
    if(/template/.test(t)) items.push('reusable templates');
    if(/prompt/.test(t) && cat!=='Prompt Pack') items.push('ready-to-use prompts');
    if(/example/.test(t)) items.push('examples');
    return [...new Set(items)].join('; ');
  }

  function buildProductBrain(){
    const name=value('productName');
    const cat=value('productCategory')||'Other Digital Product';
    const desc=value('productPlainDescription');
    const d=defaults[cat]||defaults['Other Digital Product'];
    if(!name){ if(typeof toast==='function') toast('Add the product name first.'); byId('productName')?.focus(); return; }
    if(!desc){ if(typeof toast==='function') toast('Tell the hub what the product is in your own words.'); byId('productPlainDescription')?.focus(); return; }

    const source=`${name} ${desc} ${value('productPlainIncludes')}`;
    const goal=inferGoal(source,cat);
    const audience=inferAudience(source,cat);
    const includes=inferIncluded(desc,cat);
    const plain=desc.replace(/\s+/g,' ').replace(/[.]$/,'');
    const short=plain.length>220?plain.slice(0,217).replace(/\s+\S*$/,'')+'...':plain;

    set('productInternalName',name,false);
    set('productFormat',d.format);
    set('productPrice',d.price,false); set('productRegularPrice',d.regular,false); set('productSalePrice',d.sale,false);
    set('productSummary',`${name} is a ${d.noun} that ${short.charAt(0).toLowerCase()+short.slice(1)}. It is designed to help ${audience} ${goal}.`);
    set('productProblem',`The customer wants the result, but the process can feel confusing, time-consuming, or hard to organize. They may not know what to create, what steps matter most, or how to turn an idea into a finished result.`);
    set('productTransformation',`Go from unsure, scattered, or starting from scratch to having a clear resource that helps them ${goal}.`);
    set('productPrimaryBenefit',title(goal));
    set('productSecondaryBenefits','Saves time, reduces guesswork, gives clear direction, creates a repeatable process, and makes the next step easier');
    set('productIncludes',includes);
    set('productBonuses','Suggested bonus: quick-start guide, example output, and a simple “what to do next” checklist');
    set('productRights',d.rights,false);
    set('productDelivery',d.delivery,false);
    set('productAudience',audience);
    set('productSkill','Beginner-friendly / no advanced experience required');
    set('productPainPoints','Not knowing where to start; spending too much time figuring things out; feeling overwhelmed by too many steps; inconsistent results; needing a clearer shortcut or repeatable process');
    set('productDesiredResult',`${title(goal)} with more confidence, less guesswork, and a practical process they can use again.`);
    set('productBuyReasons',`It gives them a faster starting point; simplifies a confusing process; saves time; feels practical instead of overwhelming; provides reusable value; helps them move from idea to action.`);
    set('productHesitations','They may wonder whether it is easy enough for them, whether they need special tools or experience, what exactly is included, and whether the product will save them enough time to be worth buying.');
    set('productCTA',d.cta,false);
    set('productPrimaryAngle',`${title(goal)} — without starting from scratch`);
    set('productSecondaryAngles','Save time and skip the guesswork; beginner-friendly guidance; turn an idea into action faster; reusable value; clear next steps instead of overwhelm');
    const keywords=[name,cat,'beginner friendly',goal,'digital product','easy to use','time saving'].map(x=>String(x).replace(/\s+/g,' ').trim()).filter(Boolean);
    set('productKeywords',keywords.join(', '));
    set('productSEO',`${name}; ${cat}; ${goal}; beginner-friendly ${d.noun}; digital resource for ${audience}`);

    const result=byId('productBrainResult');
    if(result){result.classList.add('product-brain-done');result.innerHTML=`<b>Done.</b> The hub built the strategy for <b>${name}</b>: audience, problem, transformation, benefits, buyer reasons, hesitations, sales angles, CTA, keywords, SEO, delivery wording, rights, bonus suggestion and starter pricing. You can save it now, or open “Hub-Generated Product Intelligence” only if you want to review it.`;}
    if(typeof toast==='function') toast('Product Brain finished the strategy for you.');
  }

  window.addEventListener('DOMContentLoaded',()=>{
    byId('easyFillProductBtn')?.addEventListener('click',buildProductBrain);
    // Keep the plain-language description synced when editing an older saved product.
    byId('productCategory')?.addEventListener('change',()=>{});
  });
})();
</script>'''
          s,n2=script_pat.subn(js,s,count=1)
          print('script replacements',n2)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Product Brain upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make Product Builder strategy automatic [skip product-brain] [skip easy-builder]"
            git push
          fi
